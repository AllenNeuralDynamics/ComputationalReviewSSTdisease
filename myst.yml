version: 1
extends:
  - content/authors.yml
project:
  title: "Somatostatin Interneurons in Neurodegenerative Disease"
  subtitle: A Reproducible Computational Review
  description: >
    A reproducible computational critical review of somatostatin (SST) interneurons in neurodegenerative disease.
  keywords:
    - neuroscience
    - somatostatin
    - interneurons
    - neurodegeneration
    - critical review
    - reproducible research
  license: MIT
  open_access: true
  numbering:
    figure:
      continue: true
    table:
      continue: true
    equation:
      continue: true
    code:
      continue: true
  plugins:
    - https://github.com/AllenNeuralDynamics/AuthorshipExtractor/releases/latest/download/authorship-plugin.mjs
    - plugins/evidence-explorer-plugin.mjs
    - plugins/figure-lightbox-plugin.mjs
  github: https://github.com/AllenNeuralDynamics/ComputationalReviewSSTdisease
  bibliography:
    - content/references.bib
  toc:
    - file: content/00_frontmatter.md
    - file: content/01_section.md
      title: "Introduction"
    - file: content/02_section.md
      title: "SST Interneuron Identity: Transcriptomic Subtypes, Connectivity, and Somatostatin Receptor Signaling"
    - file: content/03_section.md
      title: "Selective Vulnerability of SST Interneurons in Aging and Neurodegeneration"
    - file: content/04_section.md
      title: "Alzheimer's Disease: SST Loss, Amyloid-β and Neprilysin, Tau, and Network Hyperexcitability"
    - file: content/05_section.md
      title: "Parkinson's Disease and Lewy Body Dementias"
    - file: content/06_section.md
      title: "Huntington's Disease and Striatal SST Interneurons"
    - file: content/07_section.md
      title: "ALS, Frontotemporal Dementia, and Other Neurodegenerative Conditions"
    - file: content/08_section.md
      title: "Circuit Consequences: Dendritic Inhibition, Oscillations, Sleep, and Memory"
    - file: content/09_section.md
      title: "Human Evidence: Postmortem Pathology, Single-Nucleus Atlases, and CSF Somatostatin as a Biomarker"
    - file: content/10_section.md
      title: "Therapeutic Strategies: Somatostatin Receptor Agonists, Interneuron-Targeted Interventions, and Neuromodulation"
    - file: content/11_section.md
      title: "Conflicting Evidence, Model Limitations, and Open Questions"
    - file: content/12_section.md
      title: "Conclusion"
    - file: content/Methods.md
      title: Methods
    - file: content/evidence_database.md
      title: Evidence Database
    - file: content/provenance.md
      title: Pipeline Provenance
  exports:
    - format: tex
      output: review_manuscript.tex
      template: ./latex/template
    - format: pdf
      output: review_manuscript.pdf
      template: ./latex/template
site:
  template: book-theme
  title: "Somatostatin Interneurons in Neurodegenerative Disease"
  nav:
    - title: GitHub
      url: https://github.com/AllenNeuralDynamics/ComputationalReviewSSTdisease
